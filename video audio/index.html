<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Audio & Video Implementation</title>
    
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    
    <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/code.videojs.com/videojs-youtube/3.0.1/Youtube.min.js"></script>
</head>
<body>

    <h2>Assignment: Video Implementation</h2>
    
    <video
      id="vid1"
      class="video-js vjs-default-skin vjs-big-play-centered"
      controls
      width="640" height="360"
      data-setup='{ "techOrder": ["youtube"], "sources": [{ "type": "video/youtube", "src": "https://www.youtube.com/watch?v=XCsppc963NI"}] }'>
    </video>

    <hr>

    <h2>Assignment: Audio Implementation</h2>
    <audio controls>
        <source src="your-audio-file.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

</body>
</html>
