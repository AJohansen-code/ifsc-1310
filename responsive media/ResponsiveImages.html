<!DOCTYPE html>
<html lang="en">
<head>
        <style>
    img {
        max-width: 100%;
        height: auto;
        display: block;
    }
</style>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Creating Responsive Images</title>
</head>
<body>
        <img src="Matt-and-Dino.JPG" 
     srcset="Matt-and-Dino.JPG 500w, 
             Matt-and-Dino-1000.JPG 1000w, 
             Matt-and-Dino-1500.JPG 1500w" 
     sizes="(max-width: 600px) 480px, 
            800px" 
     alt="My husband hanging out with his dinosaur friend.">
</body>
</html>
